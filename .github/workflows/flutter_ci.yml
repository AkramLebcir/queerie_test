name: Flutter CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Show Dart version
        run: dart --version
      - name: Remove Flutter tool cache
        run: |
          flutter --version
          flutter clean
          flutter pub cache repair
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test --coverage
      - name: Build APK (sandbox)
        run: flutter build apk --flavor sandbox -t lib/main.dart --dart-define-from-file .env.sandbox.json
      - name: Build APK (staging)
        run: flutter build apk --flavor staging -t lib/main.dart --dart-define-from-file .env.staging.json
      - name: Build APK (prod)
        run: flutter build apk --flavor prod -t lib/main.dart --dart-define-from-file .env.prod.json
      - name: List APK output
        run: ls -R build/app/outputs/flutter-apk/
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: build-apks
          path: build/app/outputs/flutter-apk/ 